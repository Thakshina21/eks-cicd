
name: EKS Application CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./eks-python-backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/eks-python-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./eks-python-backend/eks-nodejs-frontend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/eks-nodejs-frontend:${{ github.sha }}

      - name: Update Kubernetes image tags
        run: |
          sed -i "s|image: .*eks-python-backend:.*|image: ${{ steps.login-ecr.outputs.registry }}/eks-python-backend:${{ github.sha }}|" eks-python-backend/backend-deployment.yaml

          sed -i "s|image: .*eks-nodejs-frontend:.*|image: ${{ steps.login-ecr.outputs.registry }}/eks-nodejs-frontend:${{ github.sha }}|" eks-python-backend/eks-nodejs-frontend/frontend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eks-python-backend/backend-deployment.yaml
          git add eks-python-backend/eks-nodejs-frontend/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes detected."
          else
            git commit -m "Update Kubernetes image tags to ${{ github.sha }}"
            git push origin HEAD:main
          fi

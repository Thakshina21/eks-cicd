
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-frontend
  template:
    metadata:
      labels:
        app: nodejs-frontend
    spec:
      containers:
        - name: nodejs-frontend
          image: 197285016566.dkr.ecr.ap-south-1.amazonaws.com/eks-nodejs-frontend:9cb5f4fcf4c85092b80dcd587f2483f1caa762b2
          ports:
            - containerPort: 3000

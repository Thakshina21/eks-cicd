
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /frontend
            pathType: Prefix
            backend:
              service:
                name: nodejs-frontend
                port:
                  number: 3000

          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: python-backend
                port:
                  number: 5000

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: python-backend
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-frontend
                port:
                  number: 3000

    - host: frontend.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-frontend
                port:
                  number: 3000

    - host: api.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: python-backend
                port:
                  number: 5000